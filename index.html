<!doctype html>
<html lang="en" class="dark" style="background-color: #0A0A0B; color: #E4E4E7;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Support Link Box — Submit • Support • Grow</title>
    <meta name="description" content="Support Link Box — Professional community support link tracking, daily tasks, automated leaderboards, streaks, and monetization management." />
    <meta property="og:title" content="Support Link Box — Submit • Support • Grow" />
    <meta property="og:description" content="Support Link Box — Professional community support link tracking, daily tasks, automated leaderboards, streaks, and monetization management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/index.css">
    <style>
      html, body {
        background-color: #0A0A0B !important;
        color: #E4E4E7 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
      }
      #root:empty::before {
        content: '';
        display: block;
        width: 36px;
        height: 36px;
        margin: 40vh auto 0;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366F1;
        border-radius: 50%;
        animation: slb-spin 0.8s linear infinite;
      }
      @keyframes slb-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #0A0A0B; color: #E4E4E7;" class="bg-[#0A0A0B] text-gray-200 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Direct static host execution for GitHub Pages fallback
      if (!window.location.host.includes('3000') && !window.location.host.includes('run.app')) {
        const s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = 'anonymous';
        s.src = './assets/index.js';
        s.onerror = () => {
          const root = document.getElementById('root');
          if (root && root.children.length === 0) {
            root.innerHTML = `
              <div style="padding: 28px 20px; max-width: 440px; margin: 60px auto; text-align: center; font-family: system-ui, -apple-system, sans-serif; background: #121215; border: 1px solid #27272A; border-radius: 16px; color: #F4F4F5;">
                <div style="font-size: 32px; margin-bottom: 12px;">⏳</div>
                <h3 style="color: #818CF8; font-size: 18px; margin-bottom: 8px; font-weight: 600;">সাইট তৈরি হচ্ছে</h3>
                <p style="font-size: 14px; color: #A1A1AA; line-height: 1.6; margin-bottom: 20px;">
                  GitHub Actions আপনার সাইটটি বিল্ড করছে। অনুগ্রহ করে ১-২ মিনিট পর রিফ্রেশ করুন অথবা Settings > Pages এ <b>GitHub Actions</b> সিলেক্ট নিশ্চিত করুন।
                </p>
                <button onclick="window.location.reload()" style="background: #6366F1; color: #FFFFFF; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;">
                  🔄 রিলোড করুন
                </button>
              </div>
            `;
          }
        };
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
